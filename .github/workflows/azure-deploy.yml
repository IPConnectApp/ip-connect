name: Deploy to Azure

on:
  push:
    branches: [ develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
    
    - name: Restore dependencies
      run: dotnet restore src/ip-connect/ip-connect.csproj
    
    - name: Build
      run: dotnet build src/ip-connect/ip-connect.csproj --configuration Release --no-restore
    
    - name: Publish
      run: dotnet publish src/ip-connect/ip-connect.csproj -c Release -o ${{env.DOTNET_ROOT}}/ip-connect-app
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: .net-app
        path: ${{env.DOTNET_ROOT}}/ip-connect-app

  deploy:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: .net-app
    
    - name: Deploy to Azure
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'ipconnect-app'
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: .